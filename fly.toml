# fly.toml — Polymarket Edge Finder
# Replace the app name with your own after `fly launch --no-deploy`.
app = "polymarket-edge-finder"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "sqlite:////data/app.db"
  PORT = "8080"
  APP_ENV = "prod"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
